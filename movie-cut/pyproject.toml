[project]
name = "movie-cut"
version = "0.1.0"
description = "CLI + GUI movie cutting utility"
requires-python = ">=3.10"
dependencies = [
    "moviepy>=2.0.0",
]

[project.scripts]
movie-cut = "movie_cut.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["movie_cut"]
