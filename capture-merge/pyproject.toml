[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capture-merge"
version = "0.1.0"
description = "CLI tool for capture-merge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
capture-merge = "capture_merge.main:main"
