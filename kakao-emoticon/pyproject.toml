[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kakao-emoticon"
version = "0.1.0"
readme = "README.md"
description = "Scrape Kakao emoticons and convert them to animated GIFs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
kakao-emoticon = "kakao_emoticon.main:main"

